monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-sound"
      }
    ]
    actions = {
      update-props = {
        device.profile = "HiFi"
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_output.platform-sound.*"
      }
    ]
    actions = {
      update-props = {
        channelmix.min-volume = 0.0
        channelmix.max-volume = 5.0
      }
    }
  }
]
